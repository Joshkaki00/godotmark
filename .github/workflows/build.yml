name: Build GodotMark

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-4.3-mono
    
    - name: Download Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/godot
        cd ~/godot
        wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip
        unzip Godot_v4.3-stable_mono_linux_x86_64.zip
        chmod +x Godot_v4.3-stable_mono_linux_x86_64
    
    - name: Download Export Templates
      run: |
        mkdir -p ~/.local/share/godot/export_templates/4.3.stable.mono
        cd ~/.local/share/godot/export_templates/4.3.stable.mono
        wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_export_templates.tpz
        unzip Godot_v4.3-stable_mono_export_templates.tpz
        mv templates/* .
    
    - name: Restore .NET dependencies
      working-directory: godotmark
      run: dotnet restore
    
    - name: Build C# project
      working-directory: godotmark
      run: dotnet build -c Release
    
    - name: Import Godot project
      working-directory: godotmark
      run: ~/godot/Godot_v4.3-stable_mono_linux_x86_64 --headless --import
    
    - name: Build Godot project
      working-directory: godotmark
      run: ~/godot/Godot_v4.3-stable_mono_linux_x86_64 --headless --build-solutions
    
    - name: Test benchmark (quick run)
      working-directory: godotmark
      run: |
        timeout 120 ~/godot/Godot_v4.3-stable_mono_linux_x86_64 --headless -- --benchmark-mode --duration 5 --output test_results.json || true
        if [ -f test_results.json ]; then
          echo "✓ Benchmark test completed"
          cat test_results.json
        else
          echo "⚠ Benchmark test did not produce output (may be expected on CI)"
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-artifacts
        path: |
          godotmark/bin/
          godotmark/test_results.json
